# Publishes the image to GitHub Container Registry when a version tag is pushed:
#   git tag v1.2.0 && git push origin v1.2.0
# Produces ghcr.io/<owner>/gamelib:1.2.0, :1.2 and :latest (no :latest for
# pre-releases such as v1.2.0-rc1). The tag must match app/version.py.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        name: Tag must match app/version.py
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/version.py)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app/version.py ($v)"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gamelib
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=GameLib
            org.opencontainers.image.version=${{ needs.test.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 for Unraid; arm64 so the same tag also runs on Apple Silicon for testing
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.test.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
